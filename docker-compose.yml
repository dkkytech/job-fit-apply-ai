# Root compose for the job-fit-apply-ai migration into Docker.
#
# Services so far: db (Postgres) and markserv (renders the pipeline output dir).
# App services (bridge, frontend, pipeline) get added in later steps.
#
# Config comes from a root .env file (see .env.example); every value has a sane
# default so `docker compose up -d` works with no .env at all.

services:
  db:
    # Swap to pgvector/pgvector:pg16 when you want embeddings/similarity search
    # (semantic job<->resume matching) in the same database — drop-in, no data change.
    image: postgres:16-alpine
    # CONTAINER_PREFIX names every container of an instance (kept explicit — doctor.sh,
    # e2e-smoke.sh and host watchdog tooling reference the names). The default keeps prod
    # byte-identical; a second instance sets CONTAINER_PREFIX=jobfit-test in its env file.
    # See docs/multi-instance.md.
    container_name: ${CONTAINER_PREFIX:-jobfit}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobfit}
      POSTGRES_DB: ${POSTGRES_DB:-jobfit}
    ports:
      # Host apps connect via 127.0.0.1:${POSTGRES_PORT}; containers use host "db".
      # Loopback only by default: an unqualified "PORT:5432" binds 0.0.0.0 and exposes the
      # DB (default creds jobfit/jobfit) to the LAN. Same convention as STEEL_BIND_ADDR —
      # set POSTGRES_BIND_ADDR to the tailnet IP if you truly need remote access; never 0.0.0.0.
      - "${POSTGRES_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - jobfit-db-data:/var/lib/postgresql/data
      # Runs ONLY on first boot against an empty data volume (initdb convention).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobfit} -d ${POSTGRES_DB:-jobfit}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bridge:
    build: ./services/job-fit-apply-ai-bridge
    container_name: ${CONTAINER_PREFIX:-jobfit}-bridge
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Cap the JVM heap. Without this (and with no container mem-limit) the JVM sizes MaxHeap at
      # 25% of host RAM (~14.7 GiB) and grows into it. The bridge is the HTTP server (Ktor/Netty +
      # SQLite + artifact serving) so it gets the most headroom of the JVM services.
      JAVA_TOOL_OPTIONS: "-Xmx448m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError"
      JD_BRIDGE_HOST: "0.0.0.0"          # single wildcard connector inside the container
      JD_BRIDGE_PORT: "8765"
      JD_BRIDGE_STORE_DIR: "/data"       # SQLite queue + artifacts live on the mounted volume
      # Same DB as the host apps, addressed by the compose service name — one source of truth.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-jobfit}:${POSTGRES_PASSWORD:-jobfit}@db:5432/${POSTGRES_DB:-jobfit}"
    ports:
      # Loopback only; reached over the tailnet via `tailscale serve` (see docs/tailscale-serve.md).
      - "127.0.0.1:${JD_BRIDGE_PORT:-8765}:8765"
    volumes:
      # Persistent bind-mount root is portable: set JFAA_DATA_ROOT per host (macOS:
      # ~/Library/Application Support/JFAA; Ubuntu service host: /var/lib/jfaa). The
      # per-service override remains for exceptional layouts/backward compatibility.
      - "${JD_BRIDGE_STORE_HOST:-${JFAA_DATA_ROOT:-${HOME}/.local/share/jfaa}/bridge}:/data"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8765/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./apps/job-fit-apply-ai-backlog
      args:
        # Baked into the bundle: the bridge URL the browser calls over the tailnet.
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://richards-macbook-m1-max.tail02d0e.ts.net:8765}"
    container_name: ${CONTAINER_PREFIX:-jobfit}-frontend
    restart: unless-stopped
    ports:
      # Loopback only; reached over the tailnet via `tailscale serve` (docs/tailscale-serve.md).
      - "127.0.0.1:${FRONTEND_PORT:-3030}:3030"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3030/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  markserv:
    build: ./docker/markserv
    container_name: ${CONTAINER_PREFIX:-jobfit}-markserv
    restart: unless-stopped
    ports:
      # Loopback ONLY — no LAN / 0.0.0.0 exposure. Reached over the tailnet via
      # `tailscale serve` on the host (see docs/tailscale-serve.md), which keeps the
      # exact URL: http://<tailscale-name>:8081/...  This is the pattern for every
      # tailnet-exposed container (bridge/frontend next): bind 127.0.0.1, front with serve.
      - "127.0.0.1:${MARKSERV_PORT:-8081}:8081"
    volumes:
      # Same root-derived host dir Processor writes at /app/output; Markserv only reads.
      - "${JD_PIPELINE_OUTPUT_HOST:-${JFAA_DATA_ROOT:-${HOME}/.local/share/jfaa}/pipeline-output}:/data:ro"
    healthcheck:
      # 127.0.0.1 (not localhost): markserv binds IPv4 only, and localhost resolves to ::1 first.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  poller:
    build: ./services/job-fit-apply-ai-poller
    container_name: ${CONTAINER_PREFIX:-jobfit}-poller
    restart: unless-stopped
    # Gmail labels are account-global: two pollers on one account race and double-process.
    # The intake services are therefore profile-gated so a test instance can exclude them
    # entirely (COMPOSE_PROFILES empty in its env file). Prod must set COMPOSE_PROFILES=intake
    # in the repo-root .env — a bare `docker compose up` without it silently drops them.
    profiles: ["intake"]
    depends_on:
      bridge:
        condition: service_healthy
    environment:
      # Heap cap (see bridge). Poller does Gmail fetch + MIME parsing — modest working set.
      JAVA_TOOL_OPTIONS: "-Xmx320m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError"
      # Reaches the bridge over the compose network by service name (host publish stays loopback).
      JD_BRIDGE_URL: "http://bridge:8765"
      GMAIL_CREDENTIALS_FILE: "/secrets/dkkytech_credentials.json"
      GMAIL_TOKEN_FILE: "/secrets/tokens/gmail_token.json"
      INTAKE_BATCH_SIZE: "${INTAKE_BATCH_SIZE:-3}"
      INTAKE_MAX_SCAN: "${INTAKE_MAX_SCAN:-100}"
      INTAKE_INTER_SUBMIT_DELAY_MS: "${INTAKE_INTER_SUBMIT_DELAY_MS:-15000}"
    volumes:
      # Gmail credentials + token. RW so --reauth and a rotated refresh token persist across restarts.
      # Seed once from the existing token; the container is the sole Gmail owner after cutover.
      - "${JD_POLLER_SECRETS_HOST:-${JFAA_DATA_ROOT:-${HOME}/.local/share/jfaa}/poller-secrets}:/secrets"
    # No ports — the Poller only makes outbound calls (Gmail + bridge). Healthcheck (exec `--health`)
    # is baked into the image.

  jsearch:
    build: ./services/job-fit-apply-ai-jsearch
    container_name: ${CONTAINER_PREFIX:-jobfit}-jsearch
    restart: unless-stopped
    # Profile-gated with the poller (see its note): intake runs only where COMPOSE_PROFILES
    # activates it — prod yes, test instances no (jobs enter test via scripts/replay-jobs.sh).
    profiles: ["intake"]
    depends_on:
      bridge:
        condition: service_healthy
    environment:
      # Heap cap (see bridge). jsearch is a once/day one-shot fetch — small.
      JAVA_TOOL_OPTIONS: "-Xmx320m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError"
      JD_BRIDGE_URL: "http://bridge:8765"
      # RapidAPI key — put JSEARCH_API_KEY=... in the repo-root .env (gitignored). Required to fetch.
      JSEARCH_API_KEY: "${JSEARCH_API_KEY:-}"
      # Once/day fetch (4 calls) → ~120 of a 150/month quota. The persisted last-run makes restarts free.
      JSEARCH_INTERVAL_MS: "${JSEARCH_INTERVAL_MS:-86400000}"
    volumes:
      # Persisted last-run state so restarts don't re-fetch (and burn quota).
      - "${JD_JSEARCH_STATE_HOST:-${JFAA_DATA_ROOT:-${HOME}/.local/share/jfaa}/jsearch-state}:/state"
    # No ports — outbound only (JSearch API + bridge). Shell-loop entrypoint + heartbeat healthcheck
    # are baked into the image; the JVM only runs ~once/day and exits.

  watchlist:
    build: ./services/job-fit-apply-ai-watchlist
    container_name: ${CONTAINER_PREFIX:-jobfit}-watchlist
    restart: unless-stopped
    # Intake source like poller/jsearch: profile-gated so test instances don't poll employer feeds.
    profiles: ["intake"]
    depends_on:
      bridge:
        condition: service_healthy
    environment:
      # Heap cap (see bridge). A once/day sweep over ~170 employer feeds — small.
      JAVA_TOOL_OPTIONS: "-Xmx384m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError"
      JD_BRIDGE_URL: "http://bridge:8765"
      # Once/day sweep. Feeds are free; the persisted last-run keeps restarts from re-polling.
      WATCHLIST_INTERVAL_MS: "${WATCHLIST_INTERVAL_MS:-86400000}"
      # Or fixed local times ("05:30,17:30") in WATCHLIST_TZ (e.g. America/Los_Angeles; the container is UTC).
      WATCHLIST_RUN_AT: "${WATCHLIST_RUN_AT:-}"
      WATCHLIST_TZ: "${WATCHLIST_TZ:-}"
      # Optional overrides of the QE title pre-filter (regexes; see the service's .env.example).
      WATCHLIST_TITLE_INCLUDE: "${WATCHLIST_TITLE_INCLUDE:-}"
      WATCHLIST_TITLE_EXCLUDE: "${WATCHLIST_TITLE_EXCLUDE:-}"
      # Stale-feed alerts (a feed failing/empty 2 runs in a row) use the processor's alert channels.
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      DISCORD_CHANNEL_ID: "${DISCORD_CHANNEL_ID:-}"
    volumes:
      # Last-run state + watchlist-health.json (per-employer outcome, read by doctor.sh).
      - "${JD_WATCHLIST_STATE_HOST:-${JFAA_DATA_ROOT:-${HOME}/.local/share/jfaa}/watchlist-state}:/state"
    # No ports — outbound only (employer job feeds + bridge). Same shell-loop + heartbeat pattern as jsearch.

  # Self-hosted Steel Browser — the CDP scraping backend (replaces host Chrome).
  # Built FROM SOURCE at a pinned commit: the prebuilt steel-browser images fail to launch Chrome
  # on Apple Silicon under Docker Desktop (bundled Chromium SIGTRAPs); Steel's own api/Dockerfile
  # (apt Debian arm64 Chromium + xvfb) works. Verified end-to-end. Updated to latest main 2026-07-20.
  steel:
    build:
      context: "https://github.com/steel-dev/steel-browser.git#5880b48c1af107219ff3d904edbb8f6b76bea9b6"
      dockerfile: api/Dockerfile
      args:
        NODE_VERSION: "22.13.0"
    container_name: ${CONTAINER_PREFIX:-jobfit}-steel
    restart: unless-stopped
    # Reap zombies. Steel's own entrypoint runs as PID 1 (a shell), and Chrome — launched with
    # --no-zygote/--no-sandbox — spawns helper + crashpad processes that PID 1 never wait()s on.
    # They pile up as <defunct> (observed 20k+ over ~14h). Worse: a crashed Chrome leaves a stale
    # /tmp/steel-chrome/SingletonLock whose recorded PID is still "alive" as a zombie, so the NEXT
    # launch aborts with "SingletonLock: File exists (17)" → every createSession 500s → the wedge.
    # `init: true` runs tini as PID 1 to reap children, which stops the pileup AND frees those PIDs
    # so Chrome recognises the stale lock as dead and clears it on relaunch.
    init: true
    # Belt-and-suspenders for the watchdog-restart path: `docker restart` keeps the writable layer
    # (and thus /tmp), so a SingletonLock from the pre-restart crash can survive into the new start.
    # Remove it before Steel's entrypoint launches Chrome. Preserves the original entrypoint (it sets
    # up dbus when DEBUG=true — Chrome needs it); the image has no CMD, so there are no args to forward.
    entrypoint: ["/bin/sh", "-c", "rm -f /tmp/steel-chrome/SingletonLock 2>/dev/null || true; exec /app/api/entrypoint.sh"]
    # Mount /tmp as tmpfs so every (re)start gets a guaranteed-empty /tmp. Chrome's ephemeral
    # userDataDir is /tmp/steel-chrome and a crash can leave /tmp/steel-chrome/SingletonLock behind;
    # because `docker restart` preserves the writable layer, that stale lock would otherwise survive
    # into the next start and abort Chrome ("SingletonLock: File exists"). A tmpfs is recreated fresh
    # on every start, so no stale lock can carry across a restart — this is the durable fix; the
    # entrypoint rm above is now belt-and-suspenders (and still covers an in-place relaunch). Nothing
    # in /tmp needs to persist: the Chromium binary cache lives on the steel-data volume (/app/.cache)
    # and auth persistence is the app-side storageState store, not the ephemeral /tmp profile.
    tmpfs:
      - /tmp
    environment:
      DEBUG: "true"                  # entrypoint only initialises dbus when DEBUG=true; Chrome needs it
      DOMAIN: "${STEEL_DOMAIN:-localhost:3000}"
      CDP_DOMAIN: "${STEEL_CDP_DOMAIN:-localhost:9223}"
    volumes:
      # PUPPETEER_CACHE_DIR — caches the downloaded Chromium binary across rebuilds. NOTE: this is
      # NOT the logged-in profile (Steel runs Chrome with an ephemeral userDataDir in /tmp); auth
      # persistence is the app-side storageState store (processor state/ mount + STEEL_STORAGE_STATE_PATH).
      - steel-data:/app/.cache
    ports:
      # Publish the API/UI (and thus the interactive debug URL) on the Tailscale interface only —
      # set STEEL_BIND_ADDR to the host's tailnet IP in the repo-root .env so a phone can reach it.
      # Defaults to loopback (safe): the Steel UI has NO auth, so never bind it to 0.0.0.0.
      # STEEL_PORT moves only the HOST side (a second instance publishes 23000); the container
      # side stays 3000 — in-network consumers (STEEL_BASE_URL=http://steel:3000, the healthcheck,
      # DOMAIN) are per-project-network and never change.
      - "${STEEL_BIND_ADDR:-127.0.0.1}:${STEEL_PORT:-3000}:3000"
    healthcheck:
      # Probe REAL session creation (POST /v1/sessions), not just GET /v1/sessions. When Steel is
      # wedged (Chrome can't launch — see the SingletonLock/zombie note above — or a reused primary
      # page died), createSession fails/500s while GET /v1/sessions + /v1/health keep returning 200 —
      # a wedged-but-"healthy" container that silently drops every scrape to the email snippet. Only
      # createSession detects that. The `init: true` + lock-cleanup above target the root cause; this
      # probe stays as the detector of last resort. The probe releases its session so it doesn't leak;
      # the 20s session timeout self-expires it even if release fails. Marking the container unhealthy
      # here makes the wedge visible in `docker ps` and gives steel-watchdog.sh a status to key on
      # (Docker's restart: unless-stopped will NOT restart an unhealthy container — the watchdog does).
      # interval 60s (createSession is heavier than a GET → gentler on the single browser); retries 3
      # so a transient blip / race with a real scrape doesn't flap it — ~3 min of failures = unhealthy.
      test: ["CMD", "node", "-e", "const http=require('http');function req(m,p,b){return new Promise((res,rej)=>{const d=b?JSON.stringify(b):null;const r=http.request({host:'localhost',port:3000,path:p,method:m,headers:{'Content-Type':'application/json'},timeout:20000},x=>{let s='';x.on('data',c=>s+=c);x.on('end',()=>res({status:x.statusCode,body:s}))});r.on('error',rej);r.on('timeout',()=>{r.destroy();rej(new Error('t'))});if(d)r.write(d);r.end()})}(async()=>{try{const s=await req('POST','/v1/sessions',{timeout:20000});if(s.status!==200)process.exit(1);const id=JSON.parse(s.body).id;if(id){try{await req('POST','/v1/sessions/'+id+'/release')}catch(e){}}process.exit(0)}catch(e){process.exit(1)}})()"]
      interval: 60s
      timeout: 25s
      retries: 3
      start_period: 45s

  processor:
    build: ./services/job-fit-apply-ai-pipeline
    container_name: ${CONTAINER_PREFIX:-jobfit}-processor
    restart: unless-stopped
    depends_on:
      bridge:
        condition: service_healthy
      db:
        condition: service_healthy
      steel:
        condition: service_healthy
    # Explicit mapping is a no-op on Docker Desktop (the name resolves anyway) but makes the
    # same compose file work on plain Linux Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Heap cap (see bridge). Most headroom of the JVM services — the tailoring subgraph holds
      # the profile + large LLM JSON responses through Jackson. NB: this bounds only the JVM heap;
      # the tectonic + python PDF-render subprocesses have their own (transient) memory outside it.
      JAVA_TOOL_OPTIONS: "-Xmx640m -XX:MaxMetaspaceSize=160m -XX:+ExitOnOutOfMemoryError"
      JD_BRIDGE_URL: "http://bridge:8765"
      DB_BACKEND: "postgres"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-jobfit}:${POSTGRES_PASSWORD:-jobfit}@db:5432/${POSTGRES_DB:-jobfit}"
      # THE fit threshold: tailor at or above it, and the notifier's high-fit ping uses the same
      # value. Set it once in the repo-root .env; it beats any FIT_THRESHOLD in the pipeline .env.
      FIT_THRESHOLD: "${FIT_THRESHOLD:-50}"
      # Fits at or above this are tailored up front; FIT_THRESHOLD up to it are offered with a
      # Tailor button instead. Root .env; blank means FIT_THRESHOLD (everything that fits is tailored).
      AUTO_TAILOR_MIN_SCORE: "${AUTO_TAILOR_MIN_SCORE:-}"
      # Host-loopback services, reached directly via host.docker.internal (verified working on
      # Docker Desktop 29.x — no socat shim needed). The entrypoint rewrites the CDP endpoint's
      # hostname to an IP because Chrome DevTools rejects non-IP/localhost Host headers.
      MLX_LOCAL_BASE_URL: "http://host.docker.internal:11436/v1"
      OLLAMA_LOCAL_BASE_URL: "http://host.docker.internal:11434"
      CHROME_CDP_ENDPOINT: "http://host.docker.internal:${CHROME_DEBUG_PORT:-9222}"
      # Steel Browser backend. Set STEEL_BASE_URL=http://steel:3000 in the repo-root .env to route
      # scraping through Steel (sessions + persisted auth + phone re-auth); blank/unset falls back to
      # the host-Chrome CDP path above. STEEL_UI_URL is the tailnet base for the debug link in re-auth
      # alerts (e.g. http://<tailscale-host>:3000). Sourced from root .env — not the pipeline .env —
      # so the empty-override caveat below does not apply.
      STEEL_BASE_URL: "${STEEL_BASE_URL:-}"
      STEEL_UI_URL: "${STEEL_UI_URL:-}"
      # Tap-to-sign-in endpoint. STEEL_SIGNIN_PUBLIC_URL is the on/off switch: blank (default) and the
      # endpoint is neither started nor advertised in re-auth alerts. Binds inside the container on
      # 0.0.0.0 so the published port below can reach it; host-side exposure is what STEEL_SIGNIN_BIND_ADDR
      # controls, and that defaults to loopback.
      STEEL_SIGNIN_PUBLIC_URL: "${STEEL_SIGNIN_PUBLIC_URL:-}"
      STEEL_SIGNIN_TOKEN: "${STEEL_SIGNIN_TOKEN:-}"
      STEEL_SIGNIN_BIND_ADDR: "0.0.0.0"
      STEEL_SIGNIN_PORT: "${STEEL_SIGNIN_PORT:-3100}"
      STEEL_SIGNIN_WINDOW_MS: "${STEEL_SIGNIN_WINDOW_MS:-1800000}"
      # ARTIFACT_BASE_URL is intentionally NOT set here: an empty `${ARTIFACT_BASE_URL:-}` override
      # would win over the mounted /app/.env (real env beats dotenv in Config.get), blanking the
      # report/notification links. The value lives in services/.../pipeline/.env (markserv tailnet URL).
    volumes:
      # Same host dir markserv serves read-only at :8081 — reports/PDFs keep their URLs.
      - "${JD_PIPELINE_OUTPUT_HOST:-${JFAA_DATA_ROOT:-${HOME}/.local/share/jfaa}/pipeline-output}:/app/output"
      # Steel persisted session state (STEEL_STORAGE_STATE_PATH, PROJECT_DIR/state). Root-derived so
      # exported cookies survive restarts and are backup-able; keep private and never serve via Markserv.
      - "${JD_PIPELINE_STATE_HOST:-${JFAA_DATA_ROOT:-${HOME}/.local/share/jfaa}/pipeline-state}:/app/state"
      # Pipeline secrets + per-node model config (gitignored). dotenv reads /app/.env; real env
      # vars above win over it (Config.get precedence), so host-specific endpoints inside are
      # safely overridden. PIPELINE_ENV_FILE lets a second instance mount its own copy
      # (ARTIFACT_BASE_URL must differ per instance and cannot come from compose `environment:`
      # — see the blank-override note above). This is also the A/B lever: change models/config
      # for a test instance in its file only.
      - ${PIPELINE_ENV_FILE:-./services/job-fit-apply-ai-pipeline/.env}:/app/.env:ro
      # Personal, gitignored inputs at their default PROJECT_DIR-relative locations.
      - ./services/job-fit-apply-ai-pipeline/src/main/resources/resume/resume.yaml:/app/src/main/resources/resume/resume.yaml:ro
      - ./services/job-fit-apply-ai-pipeline/config/candidate_profile.yaml:/app/config/candidate_profile.yaml:ro
    ports:
      # Tap-to-sign-in endpoint only. Same rule as the steel service's port: published on the
      # Tailscale interface so a phone can reach it, loopback by default — it creates browser
      # sessions and redirects into an unauthenticated live view, so never bind it to 0.0.0.0.
      # Inert unless STEEL_SIGNIN_PUBLIC_URL is set (the server isn't started otherwise).
      - "${STEEL_SIGNIN_BIND_ADDR:-127.0.0.1}:${STEEL_SIGNIN_PORT:-3100}:${STEEL_SIGNIN_PORT:-3100}"
    # Otherwise outbound only (bridge, db, host LLMs/CDP, cloud APIs). Healthcheck (exec
    # --health, heartbeat freshness) is baked into the image.

  notifier:
    build: ./services/job-fit-apply-ai-notifier
    container_name: ${CONTAINER_PREFIX:-jobfit}-notifier
    restart: unless-stopped
    depends_on:
      bridge:
        condition: service_healthy
    environment:
      # Heap cap (see bridge). Notifier is a lightweight completed-event consumer.
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError"
      JD_BRIDGE_URL: "http://bridge:8765"
      # Discord/Telegram creds — put these in the repo-root .env (gitignored). Namespaced
      # notifier values win; generic Telegram values remain a backward-compatible fallback.
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      DISCORD_CHANNEL_ID: "${DISCORD_CHANNEL_ID:-}"
      NOTIFIER_TELEGRAM_BOT_TOKEN: "${NOTIFIER_TELEGRAM_BOT_TOKEN:-}"
      NOTIFIER_TELEGRAM_CHAT_ID: "${NOTIFIER_TELEGRAM_CHAT_ID:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      # Same FIT_THRESHOLD as the processor (see there) — one number for tailoring and the ping.
      FIT_THRESHOLD: "${FIT_THRESHOLD:-50}"
      # Inline buttons on the high-fit ping. Link buttons and action buttons are gated
      # independently: links are inert URLs, while an action (apply / reply / archive) is a
      # callback the JobBot agent handles — it is the bot token's only update reader.
      NOTIFIER_TELEGRAM_BUTTONS: "${NOTIFIER_TELEGRAM_BUTTONS:-false}"
      # Empty falls back to NOTIFIER_TELEGRAM_BUTTONS inside the notifier, so the two cannot
      # silently disagree.
      NOTIFIER_TELEGRAM_LINK_BUTTONS: "${NOTIFIER_TELEGRAM_LINK_BUTTONS:-}"
      # Comma-separated verbs, e.g. "apply,archive". Each button is sent only when the event
      # qualifies (docker/jobbot/contract/button_eligibility.json). Blank = no action buttons;
      # list a verb only once the jobbot service handles it (docs/jobbot.md).
      NOTIFIER_TELEGRAM_ACTIONS: "${NOTIFIER_TELEGRAM_ACTIONS:-}"
      # Optional card template JobBot edits (update_alert_template), e.g. /templates/high-fit.html.
      # Blank = the built-in format; any template problem falls back to it.
      NOTIFIER_TELEGRAM_TEMPLATE_FILE: "${NOTIFIER_TELEGRAM_TEMPLATE_FILE:-}"
      # Absolute base for bridge-relative artifact links — Telegram needs an absolute URL for a
      # link button, and the bridge serves the same resume bytes the artifacts carry.
      BRIDGE_PUBLIC_URL: "${BRIDGE_PUBLIC_URL:-}"
      # How long the resume lookup may take when a job's metadata.json must be read.
      NOTIFIER_ARTIFACT_TIMEOUT_MS: "${NOTIFIER_ARTIFACT_TIMEOUT_MS:-4000}"
    volumes:
      # Persisted consumer cursor (max completed_seq notified) — survives restarts.
      - "${JD_NOTIFIER_STATE_HOST:-${JFAA_DATA_ROOT:-${HOME}/.local/share/jfaa}/notifier-state}:/state"
      # The card template, written by jobbot-mcp; read-only here.
      - "${JD_JOBBOT_TEMPLATES_HOST:-${JFAA_DATA_ROOT:-${HOME}/.local/share/jfaa}/jobbot-templates}:/templates:ro"
      # No agent state is mounted: action buttons carry <verb>:<completed_seq>, which the agent
      # resolves against the bridge feed, so there is nothing to register here.
    # No ports — a completed-feed event consumer. Healthcheck (exec --health) baked into the image.

  # ── JobBot (profile: jobbot) — the Telegram agent for @DkkyAIJobBot. See docs/jobbot.md. ──
  # jobbot-mcp is the agent's only door into JFAA: GET-only bridge reads, read-only output files
  # and profile, and the deterministic button-tap logic. It sits on both networks; the agent
  # container sits on `jobbot` only, so it cannot resolve bridge, db or steel.
  jobbot-mcp:
    build: ./services/job-fit-apply-ai-jobbot-mcp
    container_name: ${CONTAINER_PREFIX:-jobfit}-jobbot-mcp
    profiles: ["jobbot"]
    restart: unless-stopped
    depends_on:
      bridge:
        condition: service_healthy
    networks: [default, jobbot, jobbot-browser]
    extra_hosts:
      # The fill loop's model (Ollama route on the host), same as the agent's.
      - "host.docker.internal:host-gateway"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m -XX:MaxMetaspaceSize=160m -XX:+ExitOnOutOfMemoryError"
      JD_BRIDGE_URL: "http://bridge:8765"
      # Shared secret between jobbot and jobbot-mcp (openssl rand -hex 32). Blank refuses everything.
      JOBBOT_MCP_TOKEN: "${JOBBOT_MCP_TOKEN:-}"
      JOBBOT_TELEGRAM_ALLOWED_USERS: "${JOBBOT_TELEGRAM_ALLOWED_USERS:-}"
      # Verbs JobBot acts on; keep NOTIFIER_TELEGRAM_ACTIONS a subset of this.
      JOBBOT_ACTIONS: "${JOBBOT_ACTIONS:-apply}"
      # true = validate and log taps, do nothing (cutover / shadow).
      JOBBOT_DRY_RUN: "${JOBBOT_DRY_RUN:-false}"
      FIT_THRESHOLD: "${FIT_THRESHOLD:-50}"
      # The poller's Gmail token, shared read-only (same account, same scopes). jobbot-mcp refreshes
      # access tokens in memory and never writes, deletes or re-auths this file — the poller owns it.
      JOBBOT_GMAIL_TOKEN_FILE: "/poller-secrets/tokens/gmail_token.json"
      # Replies: sending is off until verified; a ✅ Send tap is still required for every email.
      JOBBOT_SEND_ENABLED: "${JOBBOT_SEND_ENABLED:-false}"
      JOBBOT_MAX_SENDS_PER_DAY: "${JOBBOT_MAX_SENDS_PER_DAY:-10}"
      # Apply (Phase 4): off = an Apply tap answers "Not implemented yet". Needs the `apply` profile.
      JOBBOT_APPLY_ENABLED: "${JOBBOT_APPLY_ENABLED:-false}"
      JOBBOT_BROWSER_CDP_URL: "http://jobbot-browser:9223"
      JOBBOT_BROWSER_VIEWER_URL: "${JOBBOT_BROWSER_VIEWER_URL:-${JOBBOT_APPLY_VIEWER_URL:-}}"
      JOBBOT_ACCOUNT_EMAIL: "${JOBBOT_ACCOUNT_EMAIL:-dkkytech@gmail.com}"
      JOBBOT_CREDENTIALS_FILE: "/secrets/site-credentials.json"
      JOBBOT_LLM_URL: "http://host.docker.internal:11434/v1"
      JOBBOT_MODEL: "${JOBBOT_MODEL:-deepseek-v4.1-flash:cloud}"
      JOBBOT_GMAIL_CREDENTIALS_FILE: "/poller-secrets/dkkytech_credentials.json"
      JOBBOT_TEMPLATE_FILE: "/templates/high-fit.html"
    volumes:
      - "${JD_JOBBOT_TEMPLATES_HOST:-${JFAA_DATA_ROOT:-${HOME}/.local/share/jfaa}/jobbot-templates}:/templates"
      - "${JD_JOBBOT_MCP_STATE_HOST:-${JFAA_DATA_ROOT:-${HOME}/.local/share/jfaa}/jobbot-mcp-state}:/state"
      # The whole directory, not the file: a poller re-auth deletes and recreates the token, and a
      # single-file bind mount would stay pinned to the deleted inode.
      - "${JD_POLLER_SECRETS_HOST:-${JFAA_DATA_ROOT:-${HOME}/.local/share/jfaa}/poller-secrets}:/poller-secrets:ro"
      # Site logins JobBot creates (site-credentials.json, mode 600). Only jobbot-mcp mounts it.
      - "${JD_JOBBOT_SECRETS_HOST:-${JFAA_DATA_ROOT:-${HOME}/.local/share/jfaa}/jobbot-secrets}:/secrets"
      - "${JD_PIPELINE_OUTPUT_HOST:-${JFAA_DATA_ROOT:-${HOME}/.local/share/jfaa}/pipeline-output}:/jfaa/pipeline-output:ro"
      # The same personal files the processor reads (symlinks into the main checkout on releases).
      - ./services/job-fit-apply-ai-pipeline/src/main/resources/resume/resume.yaml:/jfaa/profile/resume.yaml:ro
      - ./services/job-fit-apply-ai-pipeline/config/candidate_profile.yaml:/jfaa/profile/candidate_profile.yaml:ro
    # No ports. Healthcheck (curl /health) is baked into the image.

  jobbot:
    build: ./docker/jobbot
    container_name: ${CONTAINER_PREFIX:-jobfit}-jobbot
    profiles: ["jobbot"]
    restart: unless-stopped
    depends_on:
      jobbot-mcp:
        condition: service_healthy
    networks: [jobbot]
    extra_hosts:
      # Ollama (:11434) and oMLX (:11436) run on the host.
      - "host.docker.internal:host-gateway"
    environment:
      # The JobBot bot token — the same value as NOTIFIER_TELEGRAM_BOT_TOKEN. This container is
      # the token's ONLY getUpdates reader (Telegram allows one); the notifier only sends.
      TELEGRAM_BOT_TOKEN: "${JOBBOT_TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_ALLOWED_USERS: "${JOBBOT_TELEGRAM_ALLOWED_USERS:-}"
      TELEGRAM_HOME_CHANNEL: "${JOBBOT_TELEGRAM_HOME_CHANNEL:-}"
      JOBBOT_MCP_URL: "http://jobbot-mcp:8790"
      JOBBOT_MCP_TOKEN: "${JOBBOT_MCP_TOKEN:-}"
      # Chosen by the env-llm-tuner skill; Ollama Cloud ids end in :cloud.
      JOBBOT_MODEL: "${JOBBOT_MODEL:-deepseek-v4.1-flash:cloud}"
      API_SERVER_ENABLED: "false"
      HERMES_DASHBOARD: "0"
    volumes:
      # Hermes home: sessions, memory, logs. Config, persona and plugins are re-seeded from the
      # image on every start, so nothing the agent writes there survives a restart.
      - "${JD_JOBBOT_HOME_HOST:-${JFAA_DATA_ROOT:-${HOME}/.local/share/jfaa}/jobbot}:/opt/data"
    # No ports.

  # The browser JobBot fills applications in (profile: jobbot-browser). Headed Chromium with a persistent
  # profile (site logins + the dkkytech@ Google session); CDP is reachable only on the private
  # `jobbot-browser` network, from jobbot-mcp; the web viewer is published on host loopback for
  # `tailscale serve`, behind JOBBOT_BROWSER_PASSWORD. See docs/jobbot.md (Apply).
  jobbot-browser:
    build: ./docker/jobbot-browser
    container_name: ${CONTAINER_PREFIX:-jobfit}-jobbot-browser
    # "apply" is the profile's old name, kept so an older COMPOSE_PROFILES still starts it.
    profiles: ["jobbot-browser", "apply"]
    restart: unless-stopped
    networks: [jobbot-browser]
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "America/Los_Angeles"
      # The old APPLY_BROWSER_* names still work.
      CUSTOM_USER: "${JOBBOT_BROWSER_USER:-${APPLY_BROWSER_USER:-richard}}"
      # Required: the container refuses to start without it (the viewer is a browser signed in to Google).
      PASSWORD: "${JOBBOT_BROWSER_PASSWORD:-${APPLY_BROWSER_PASSWORD:-}}"
    volumes:
      - "${JD_JOBBOT_BROWSER_HOST:-${JD_APPLY_BROWSER_HOST:-${JFAA_DATA_ROOT:-${HOME}/.local/share/jfaa}/jobbot-browser}}:/config"
    ports:
      - "127.0.0.1:${JOBBOT_BROWSER_VIEWER_PORT:-${APPLY_VIEWER_PORT:-3200}}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:9222/json/version"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3g

networks:
  # The agent's network: jobbot and jobbot-mcp only. Outbound internet still works (Telegram,
  # web research); JFAA's own services are not on it.
  jobbot:
  # JobBot's browser network: jobbot-browser and jobbot-mcp only — the agent cannot reach CDP.
  jobbot-browser:

volumes:
  jobfit-db-data:
  steel-data:
