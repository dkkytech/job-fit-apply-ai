# Slim pipeline config template — everything the résumé (resume.yaml) does NOT carry.
# `--init-profile` copies this to config/candidate_profile.yaml and opens your $EDITOR so you
# can replace every __TODO__ value. Résumé content (identity, summary, experience, education,
# skills) is authored separately in resume.yaml.

scoring:
  # NOTE: years_experience, languages, and domain expertise are all derived from resume.yaml — not set here.
  # The role(s) you're targeting — steers fit scoring.
  target_title: "__TODO__: target role title (e.g. 'Staff SDET')"
  # Your top differentiators — weighed heavily by Score Fit.
  core_strengths:
    - "__TODO__: top differentiator 1"
    - "__TODO__: top differentiator 2"

# Inputs for the resume-tailoring subgraph. All three are optional: entries still
# containing "__TODO__" (and blank entries) are ignored at load time, so it is safe to
# fill these in gradually.
tailoring:
  # One sentence, in your own voice, saying how you want to be positioned. The summary
  # rewrite anchors its angle/voice to this instead of drifting per job description.
  # Example: "Staff-level SDET who builds the mobile test infrastructure other teams
  # standardize on — frameworks, CI/CD pipelines, and device labs, at consumer scale."
  positioning_statement: "__TODO__: one-sentence positioning in your own voice"

  # Verified facts that are TRUE but not written on the résumé — extra evidence the
  # tailoring pipeline may cite when a JD asks for something the résumé under-states.
  # Keep each entry one self-contained fact with numbers/context where real. Examples:
  #   - "Interviewed and hired 4 SDETs at Acme (2022–2024); designed the automation interview loop"
  #   - "Reduced Android PR pipeline from 55 min to 22 min at Acme by sharding Espresso suites (2023)"
  #   - "Wrote the org-wide test strategy doc adopted by 3 app teams at Beta LLC"
  #   - "Administered Grafana dashboards tracking flakiness for 6 services"
  evidence_bank:
    - "__TODO__: verified fact 1 (metric + context)"
    - "__TODO__: verified fact 2"

  # Terms you never want on a generated resume even if a JD matches them — tools you
  # touched once, skills too rusty to interview on, or claims you consider misleading.
  # These are always classified unsupported and leak-checked in the final output. Examples:
  #   - "Ruby"            # one internship 12 years ago; would fail a screen
  #   - "Machine Learning" # took a course; cannot defend in an interview
  #   - "Performance testing" # ran k6 twice; not a real competency
  never_claim:
    - "__TODO__: term to never claim 1"

preferences:
  # false: onsite or hybrid roles whose office is in a different US state (or outside the US)
  # than identity.location's state are skipped. Remote roles, and roles with no identifiable
  # state, are never skipped for location.
  willing_to_relocate: false
  relocation_notes: "__TODO__: free text about relocation/work-arrangement preferences"
  visa_status: "__TODO__: e.g. 'US Citizen', 'H1B', 'GC'"
  visa_sponsorship_required: false
  available_to_start_date: "__TODO__: e.g. 'Immediately' or 'YYYY-MM-DD'"
  notice_period_days: null
  preferred_work_arrangement: "__TODO__: e.g. 'Remote', 'Hybrid Seattle', 'Onsite NYC only'"
  current_base_salary: null
  minimum_total_compensation: "__TODO__: target TC (USD, e.g. '180000')"
  compensation_notes: "__TODO__: any context on comp expectations"
  open_to_equity_only_roles: false
  willing_to_travel: false
  travel_percentage: "__TODO__: e.g. '<= 10%'"
  open_to_contract_roles: false
  minimum_contract_rate_hourly: null
  additional_notes: null
