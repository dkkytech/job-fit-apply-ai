name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: PR Agent review
        uses: the-pr-agent/pr-agent@v0.46.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "openrouter/meta/muse-spark-1.3-contributor"
          config.custom_model_max_tokens: "1048576"
          config.fallback_models: '["ollama/deepseek-v4.1-flash"]'
          OLLAMA.API_BASE: "https://ollama.com"
          OLLAMA.API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          openrouter.reasoning_effort: "low"
          config.restricted_mode: "true"
          config.enable_auto_approval: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          pr_reviewer.inline_key_issues: "true"
          pr_reviewer.persistent_comment: "true"
          config.output_run_details: "true"
          config.ai_timeout: "600"


