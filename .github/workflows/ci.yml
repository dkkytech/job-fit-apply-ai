name: CI — Test All Packages + Allure Report

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Prevent overlapping runs on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Web App (Vitest) ─────────────────────────────────────────────────────
  web-app:
    name: Web App — Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/job-fit-apply-ai-backlog

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/job-fit-apply-ai-backlog/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests with coverage
        run: npm run test:unit
        env:
          CI: true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web-app
          path: apps/job-fit-apply-ai-backlog/allure-results
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web-app
          path: apps/job-fit-apply-ai-backlog/coverage

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: apps/job-fit-apply-ai-backlog/coverage/lcov.info
          flags: web-app
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 2. Chrome Extension (Jest) ──────────────────────────────────────────────
  extension:
    name: Extension — Jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/job-fit-apply-ai-extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/job-fit-apply-ai-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Unit tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-extension
          path: apps/job-fit-apply-ai-extension/allure-results
          if-no-files-found: warn

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: apps/job-fit-apply-ai-extension/coverage/lcov.info
          flags: extension
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 3. Bridge (Kotlin / JUnit 5 + Allure) ───────────────────────────────────
  bridge:
    name: Bridge — Kotlin JUnit 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/job-fit-apply-ai-bridge

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-bridge-${{ hashFiles('services/job-fit-apply-ai-bridge/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-bridge-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: JaCoCo coverage report
        if: always()
        run: ./gradlew jacocoTestReport

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-bridge
          path: services/job-fit-apply-ai-bridge/build/allure-results
          if-no-files-found: warn

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-bridge
          path: services/job-fit-apply-ai-bridge/build/test-results/test

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: services/job-fit-apply-ai-bridge/build/reports/jacoco/test/jacocoTestReport.xml
          flags: bridge
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 4. Pipeline (Kotlin / JUnit 5 + Allure) ─────────────────────────────────
  pipeline:
    name: Pipeline — Kotlin JUnit 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/job-fit-apply-ai-pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-pipeline-${{ hashFiles('services/job-fit-apply-ai-pipeline/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-pipeline-

      - name: Run unit tests
        run: ./gradlew test --tests "com.jd.pipeline.nodes.*" --tests "com.jd.pipeline.cli.*" --tests "com.jd.pipeline.pipeline.*" --tests "com.jd.pipeline.utils.*" --tests "com.jd.pipeline.fixtures.*" --tests "com.jd.pipeline.functional.*" --tests "com.jd.pipeline.client.*" --tests "com.jd.pipeline.config.*" --tests "com.jd.pipeline.models.*" --tests "com.jd.pipeline.state.*"

      # Blocking as of 2026-08-03 — green on every run inspected since 2026-08-01.
      - name: Run integration tests
        run: ./gradlew test --tests "com.jd.pipeline.integration.*"

      - name: JaCoCo coverage report
        run: ./gradlew jacocoTestReport
        if: always()

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-pipeline
          path: services/job-fit-apply-ai-pipeline/build/allure-results
          if-no-files-found: warn

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-pipeline
          path: services/job-fit-apply-ai-pipeline/build/reports/jacoco

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: services/job-fit-apply-ai-pipeline/build/reports/jacoco/test/jacocoTestReport.xml
          flags: pipeline
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 4a. Poller (Kotlin / JUnit 5) ────────────────────────────────────────────
  poller:
    name: Poller — Kotlin JUnit 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/job-fit-apply-ai-poller

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-poller-${{ hashFiles('services/job-fit-apply-ai-poller/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-poller-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: JaCoCo coverage report
        if: always()
        run: ./gradlew jacocoTestReport

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-poller
          path: services/job-fit-apply-ai-poller/build/test-results/test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-poller
          path: services/job-fit-apply-ai-poller/build/reports/jacoco

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: services/job-fit-apply-ai-poller/build/reports/jacoco/test/jacocoTestReport.xml
          flags: poller
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 4b. JSearch (Kotlin / JUnit 5) ───────────────────────────────────────────
  jsearch:
    name: JSearch — Kotlin JUnit 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/job-fit-apply-ai-jsearch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-jsearch-${{ hashFiles('services/job-fit-apply-ai-jsearch/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-jsearch-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: JaCoCo coverage report
        if: always()
        run: ./gradlew jacocoTestReport

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-jsearch
          path: services/job-fit-apply-ai-jsearch/build/test-results/test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-jsearch
          path: services/job-fit-apply-ai-jsearch/build/reports/jacoco

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: services/job-fit-apply-ai-jsearch/build/reports/jacoco/test/jacocoTestReport.xml
          flags: jsearch
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 4c. Notifier (Kotlin / JUnit 5) ──────────────────────────────────────────
  notifier:
    name: Notifier — Kotlin JUnit 5
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/job-fit-apply-ai-notifier

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-notifier-${{ hashFiles('services/job-fit-apply-ai-notifier/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-notifier-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: JaCoCo coverage report
        if: always()
        run: ./gradlew jacocoTestReport

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-notifier
          path: services/job-fit-apply-ai-notifier/build/test-results/test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-notifier
          path: services/job-fit-apply-ai-notifier/build/reports/jacoco

      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: services/job-fit-apply-ai-notifier/build/reports/jacoco/test/jacocoTestReport.xml
          flags: notifier
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 4d. Compose data-root mount contract (docker only — no JVM, no build) ──
  # Its own job: the contract is pure `docker compose config`, so it should report in seconds
  # rather than waiting behind the e2e job's three upstream Kotlin builds.
  compose-data-root:
    name: Compose — data-root contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose data-root contract
        run: make compose-data-root-test

  # ── 4e. Run-analyzer (Python unittest, stdlib-only) ─────────────────────────
  run-analyzer:
    name: Run-analyzer — unittest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/job-fit-apply-ai-pipeline/tuner/run-analyzer

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No third-party deps — the analyzer and its tests are stdlib-only.
      - name: Unit + integration tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  # ── 5. E2E — Bridge → Processor → Notifier against the compose slice ────────
  # Fake LLM + notification sink run inside the test JVM (services/job-fit-apply-ai-e2e);
  # containers reach them via host.docker.internal. Blocking as of 2026-08-03: 13 consecutive
  # green runs since it landed on 2026-07-29, including the four-scenario expansion in #58.
  # A red suite now fails the workflow — see the junit-results-e2e / e2e-compose-logs artifacts.
  e2e:
    name: E2E — Bridge → Processor → Notifier
    runs-on: ubuntu-latest
    needs: [bridge, pipeline, notifier]
    # Backstop against a wedged slice burning the 6h default job budget.
    timeout-minutes: 45

    env:
      COMPOSE_PROJECT_NAME: jobfit-e2e
      # Must match between compose interpolation and the test JVM. 21436, not the
      # production oMLX port 11436 — see docker-compose.e2e.yml.
      E2E_FAKE_LLM_PORT: '21436'
      E2E_SINK_PORT: '18099'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-e2e-${{ hashFiles('services/job-fit-apply-ai-e2e/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-e2e-

      - uses: docker/setup-buildx-action@v3

      - name: Prepare bind-mount sources
        run: ./scripts/e2e-ci-prepare.sh --fresh

      # Build the four images with the GHA layer cache. The processor image is the
      # expensive one (apt + pinned tectonic + TeX warm-up compile) and is fully
      # cacheable — a warm run skips all of it.
      - name: Build images (buildx bake + GHA cache)
        uses: docker/bake-action@v5
        with:
          source: .
          files: |
            docker-compose.yml
            docker-compose.e2e.yml
          targets: |
            bridge
            markserv
            processor
            notifier
          load: true
          # Per-target cache scopes. `type=gha` defaults to scope=buildkit, and the
          # Actions cache API is write-once per key — with a single shared scope the
          # four targets race and whichever finishes first wins, so the expensive
          # processor image (apt + pinned tectonic + TeX warm-up) would randomly
          # restore nothing and rebuild cold.
          #
          # processor exports mode=min on purpose: mode=max on that image would push
          # every intermediate layer into a 10 GB repo-wide LRU cache and evict the
          # ~/.gradle entries the five service jobs depend on.
          set: |
            bridge.cache-from=type=gha,scope=e2e-bridge
            bridge.cache-to=type=gha,mode=max,scope=e2e-bridge
            markserv.cache-from=type=gha,scope=e2e-markserv
            markserv.cache-to=type=gha,mode=max,scope=e2e-markserv
            processor.cache-from=type=gha,scope=e2e-processor
            processor.cache-to=type=gha,mode=min,scope=e2e-processor
            notifier.cache-from=type=gha,scope=e2e-notifier
            notifier.cache-to=type=gha,mode=max,scope=e2e-notifier

      # --wait blocks until every started service is healthy and fails immediately if
      # one exits, which the old hand-rolled inspect loop could not distinguish from
      # "still starting" — it waited the full 240s per container, serially.
      - name: Start the e2e slice
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            up -d --wait --wait-timeout 300 db bridge markserv processor notifier

      # Second, prod-shaped "source" slice for the multi-instance acceptance scenarios
      # (#56 sc. 9/10): own project name, ports, and ./.e2e-src state; db/bridge/markserv/
      # notifier only — no processor, no intake. Reuses the images baked above, so this
      # adds container start time, not build time. CI never mounts real production data:
      # both slices are repo-local synthetic state.
      - name: Start the source slice (multi-instance scenarios)
        env:
          COMPOSE_PROJECT_NAME: jobfit-e2e-src
          E2E_STATE_DIR: ./.e2e-src
          E2E_POSTGRES_PORT: '15434'
          E2E_BRIDGE_PORT: '19765'
          E2E_MARKSERV_PORT: '19082'
        run: |
          E2E_STATE_DIR=.e2e-src ./scripts/e2e-ci-prepare.sh --fresh
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            up -d --wait --wait-timeout 240 db bridge markserv notifier

      - name: Dump container logs if the slice never came up
        if: failure()
        run: |
          for c in jobfit-e2e-db jobfit-e2e-bridge jobfit-e2e-markserv jobfit-e2e-processor jobfit-e2e-notifier; do
            echo "::group::$c"
            # 2>&1: JVM stack traces go to stderr, which a bare pipe to tail would let
            # through unbounded while claiming to show the last 50 lines.
            docker logs --tail 50 "$c" 2>&1 || true
            echo "::endgroup::"
          done

      - name: Run e2e suite
        working-directory: services/job-fit-apply-ai-e2e
        env:
          # Presence of E2E_SOURCE_BRIDGE_URL is what activates MultiInstanceE2ETest.
          E2E_SOURCE_BRIDGE_URL: http://127.0.0.1:19765
          E2E_SOURCE_DATABASE_URL: postgresql://jobfit:jobfit@127.0.0.1:15434/jobfit
          E2E_SOURCE_STATE_DIR: ../../.e2e-src
          E2E_SOURCE_PROJECT: jobfit-e2e-src
          E2E_PROJECT: jobfit-e2e
        run: chmod +x ./gradlew && ./gradlew test

      # Scenario 9's teardown clause: stopping/resetting the test instance must leave the
      # source instance healthy. The job-level COMPOSE_PROJECT_NAME targets the test slice.
      - name: Stop the test slice and verify the source slice survives
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml down --remove-orphans
          curl -sf http://127.0.0.1:19765/health
          [ "$(docker inspect -f '{{.State.Health.Status}}' jobfit-e2e-src-bridge)" = healthy ]
          echo "source slice healthy after test-slice teardown"

      - name: Dump compose logs
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            logs --no-color > e2e-compose-logs.txt || true

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-compose-logs
          path: e2e-compose-logs.txt
          if-no-files-found: ignore

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e
          path: services/job-fit-apply-ai-e2e/build/allure-results
          if-no-files-found: warn

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-e2e
          path: services/job-fit-apply-ai-e2e/build/test-results/test

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            down -v --remove-orphans || true
          COMPOSE_PROJECT_NAME=jobfit-e2e-src E2E_STATE_DIR=./.e2e-src \
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
            down -v --remove-orphans || true

  # ── 6. Allure Report — collect, generate, publish ───────────────────────────
  allure-report:
    name: Allure Report → GitHub Pages
    runs-on: ubuntu-latest
    needs: [web-app, extension, bridge, pipeline, poller, jsearch, notifier, e2e]
    if: always()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Download every allure-results artifact from all jobs
      - name: Download web-app results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-web-app
          path: allure-results/web-app
        continue-on-error: true

      - name: Download extension results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-extension
          path: allure-results/extension
        continue-on-error: true

      - name: Download bridge results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-bridge
          path: allure-results/bridge
        continue-on-error: true

      - name: Download pipeline results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-pipeline
          path: allure-results/pipeline
        continue-on-error: true

      - name: Download e2e results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-e2e
          path: allure-results/e2e
        continue-on-error: true

      # Merge all sub-directories into one flat allure-results folder
      - name: Merge Allure results
        run: |
          mkdir -p merged-allure-results
          find allure-results -name "*.json" -o -name "*.xml" -o -name "*.txt" -o -name "*.png" \
            | while read f; do cp "$f" merged-allure-results/; done
          echo "Merged $(ls merged-allure-results | wc -l) result files"

      # Restore historical Allure trend from gh-pages
      - name: Restore Allure history from gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0
        continue-on-error: true

      - name: Copy history into results
        run: |
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history merged-allure-results/history || true
          fi

      # Generate the HTML report
      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure report
        run: allure generate merged-allure-results --clean -o allure-report

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # Publish to gh-pages only on pushes to main
      - name: Publish to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true
          commit_message: "ci: publish Allure report for ${{ github.sha }}"
